{% extends 'main/base.html' %}

{% block title %}LinkLet{% endblock %}

{% block content %}
<div class="result-container">
    <h3 class="result-title">Ваша короткая ссылка готова!</h3>

    <div class="result-card">
        <div class="result-row">
            <span class="result-label">Оригинальная ссылка:</span>
            <span class="result-url">{{ original_url|truncatechars:50 }}</span>
        </div>

        <div class="result-row">
            <span class="result-label">Короткая ссылка:</span>
            <div class="short-link-wrapper">
                <a href="{% url 'redirect_to_original' short_code=short_code %}"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="short-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="link-icon" viewBox="0 0 16 16">
                        <path d="M4.715 6.542 3.343 7.914a3 3 0 1 0 4.243 4.243l1.828-1.829A3 3 0 0 0 8.586 5.5L8 6.086a1 1 0 0 0-.154.199 2 2 0 0 1 .861 3.337L6.88 11.45a2 2 0 1 1-2.83-2.83l.793-.792a4 4 0 0 1-.128-1.287z"/>
                        <path d="M6.586 4.672A3 3 0 0 0 7.414 9.5l.775-.776a2 2 0 0 1-.896-3.346L9.12 3.55a2 2 0 1 1 2.83 2.83l-.793.792c.112.42.155.855.128 1.287l1.372-1.372a3 3 0 1 0-4.243-4.243z"/>
                    </svg>
                    {{ request.get_host }}/{{ short_code }}
                </a>
            </div>
        </div>

        <div class="result-actions">
            <a href="{% url 'add_url' %}" class="btn btn-primary">Создать новую ссылку</a>
        </div>
    </div>
</div>
{% endblock %}
